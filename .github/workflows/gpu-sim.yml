name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the CUDA tests (JIARRAY_WITH_CUDA_TESTS) and runs them on a simulated NVIDIA
# H100 (https://github.com/pantheongpu/pantheonsim). A simulator has no timing
# model and cannot reproduce hardware-specific behavior, so it complements
# real-GPU testing and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "include/**"
      - "test/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-tests:
    name: CUDA tests (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install GoogleTest
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtest-dev libgmock-dev

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@a1b9d4237411f9b2b0e0bb895b4d83377f336a7b # v0.1.9
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # 90-virtual embeds PTX only, which the simulator runs. The simulator
      # needs a shared CUDA runtime.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DJIARRAY_BUILD_TESTS=ON \
            -DJIARRAY_WITH_CUDA_TESTS=ON \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared

      # Only the CUDA test executables; the host-only suites need no GPU.
      # device_array_bench is a timing benchmark and is not built.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          targets=$(cmake --build build --target help | sed -n 's/^\.\.\. //p' | sed 's/ .*//' \
            | grep -E '^dnegri\.jiarray\.(device_array_(test|rowmajor_test|host_test)|cuda_array_init0_.*_test)$')
          echo "$targets"
          test "$(echo "$targets" | wc -l)" -eq 11
          vgpu run --preload cmake --build build -j3 --target $targets

      # ctest fails on a failed gtest. The job also fails when no test was
      # found, when fewer than 30 ran, or when any test was skipped or not run.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          vgpu run ctest --test-dir build --output-on-failure --no-tests=error \
            -R 'CudaArrayInit0Test|DeviceArray' | tee ctest.log
          grep -q "100% tests passed, 0 tests failed out of" ctest.log
          n=$(sed -n 's/.*tests passed, 0 tests failed out of \([0-9]*\).*/\1/p' ctest.log)
          test "${n:-0}" -ge 30
          if grep -Eqi "skipped|not run|\*\*\*Failed|CUDA error|NOT_BUILT" ctest.log; then
            echo "::error::a test was skipped, not run or failed"
            exit 1
          fi
